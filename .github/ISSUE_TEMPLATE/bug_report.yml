name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. See ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Android, Safari on iPhone 15...
  - type: textarea
    id: project
    attributes:
      label: Exported project (Arquivo › Exportar JSON)
      description: Attach the file or paste it here if the bug depends on a specific plan.
